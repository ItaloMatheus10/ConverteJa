<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConverteJá - Conversor de unidades</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>ConverteJá</h1>
    <p>Converta comprimento, massa e temperatura em um clique.</p>
  </header>

  <main>
    <section class="cartao">
      <h2>Converter</h2>

      <form id="form-conversao" novalidate>
        <label for="categoria">Categoria</label>
        <select id="categoria">
          <option value="comprimento">Comprimento</option>
          <option value="massa">Massa</option>
          <option value="temperatura">Temperatura</option>
        </select>

        <label for="valor">Valor</label>
        <input type="text" id="valor" inputmode="decimal"
               placeholder="Ex.: 5 ou 2,5" autocomplete="off">

        <label for="origem">De</label>
        <select id="origem"></select>

        <label for="destino">Para</label>
        <select id="destino"></select>

        <button type="submit">Converter</button>
      </form>

      <p id="resultado" class="resultado" aria-live="polite"></p>
    </section>
    <section class="cartao">
      <h2>Últimas conversões</h2>
      <ul id="historico" class="historico"></ul>
      <p id="historico-vazio" class="aviso">Nenhuma conversão ainda.</p>
      <button type="button" id="limpar-historico" class="botao-secundario">
        Limpar histórico
      </button>
    </section>
  </main>

  <footer>
    <p>Atividade de Desenvolvimento de Sistemas Web · UFMA · 2026.2</p>
  </footer>
</body>
</html>
